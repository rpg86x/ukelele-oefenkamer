<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukelele Oefenkamer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Shrikhand&display=swap" rel="stylesheet">
<style>
/* Layout: links het instrument (aanslaan + ritme), rechts het akkoord dat je leert; daaronder de akkoordenbibliotheek per stap. */
:root{
  --bg:#eaf3ef; --surface:#ffffff; --ink:#12302e; --muted:#57726f; --line:#cddbd6;
  --accent:#d5335e; --accent-ink:#ffffff; --sun:#e9a91f;
  --wood1:#cf9052; --wood2:#a5652e; --hole:#27170d; --string:#f7f1e3;
  --display:"Shrikhand","Georgia",serif; --body:"Karla","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c2123; --surface:#132e2f; --ink:#e7f2ee; --muted:#93afab; --line:#27494a;
    --accent:#ff6f93; --accent-ink:#2b0713; --sun:#f3bd45;
    --wood1:#b67a41; --wood2:#875022; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c2123; --surface:#132e2f; --ink:#e7f2ee; --muted:#93afab; --line:#27494a;
  --accent:#ff6f93; --accent-ink:#2b0713; --sun:#f3bd45;
  --wood1:#b67a41; --wood2:#875022; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);margin:0;letter-spacing:.01em;line-height:1.05}
h1 .acc{color:var(--accent)}
h1 small{font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:6px;letter-spacing:0}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:5px 12px;font-weight:700;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
header p{margin:0;color:var(--muted);font-size:14px}
kbd{font-family:var(--body);font-size:12px;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}

/* snelle akkoorden */
.quick{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:700;font-size:17px;min-width:58px;transition:transform .08s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{font-weight:500;font-size:11px;opacity:.7;margin-left:6px}

/* het instrument */
.pad{position:relative;height:270px;border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;
  background:
    repeating-linear-gradient(92deg,rgba(60,30,5,.07) 0 2px,transparent 2px 9px),
    linear-gradient(160deg,var(--wood1),var(--wood2));}
.hole{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;background:var(--hole);
  box-shadow:0 0 0 7px rgba(255,236,200,.28),0 0 0 9px rgba(60,30,5,.35), inset 0 6px 18px rgba(0,0,0,.6)}
.string{position:absolute;left:0;right:0;height:28px;margin-top:-14px;display:flex;align-items:center;pointer-events:none}
.string i{display:block;flex:1;background:var(--string);border-radius:2px;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.string b{width:54px;text-align:center;font-weight:700;color:#fff8ea;text-shadow:0 1px 2px rgba(0,0,0,.5);font-size:15px}
.string em{width:54px;text-align:center;font-style:normal;font-size:12px;color:#fff8ea;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.string.ring i{animation:vib .45s ease-out}
@keyframes vib{0%{transform:translateY(-3px)}20%{transform:translateY(3px)}40%{transform:translateY(-2px)}60%{transform:translateY(2px)}80%{transform:translateY(-1px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.string.ring i{animation:none;opacity:.6}}
.padhint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:#fff8ea;opacity:.8;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.strums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.strum{border:0;border-radius:14px;padding:14px 10px;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .07s, background .1s}
.strum .arr{font-size:24px;line-height:1}
.strum:active,.strum.hit{transform:scale(.97);background:var(--accent);color:var(--accent-ink)}

/* ritme */
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.step{border:1.5px solid var(--line);border-radius:10px;padding:6px 0 4px;text-align:center;display:flex;flex-direction:column;gap:0}
.step .a{font-size:20px;font-weight:700;line-height:1.1}
.step .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.rest .a{color:var(--line)}
.step.on{background:var(--sun);border-color:var(--sun);color:#2a1a05}
.step.on .n{color:#2a1a05}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pats{display:flex;gap:6px;flex-wrap:wrap}
.pat{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:7px 11px;font-size:14px;font-weight:500}
.pat[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.play{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 22px;font-size:16px;min-width:120px}
.tempo{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.tempo input{flex:1;accent-color:var(--accent);min-width:90px}
.tempo output{font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
label.check input{accent-color:var(--accent);width:17px;height:17px}

/* akkoord leren */
.learn{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:start}
@media (max-width:420px){.learn{grid-template-columns:1fr;justify-items:center;text-align:center}}
.cname{font-family:var(--display);font-size:64px;line-height:1;margin:0;color:var(--accent)}
.cfull{margin:2px 0 8px;color:var(--muted);font-size:14px}
.notes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
@media (max-width:420px){.notes{justify-content:center}}
.note{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.note b{color:var(--muted);font-weight:500;margin-right:4px}
.tip{margin:0;font-size:15px;max-width:38ch}
svg.dia{width:170px;height:auto;display:block}
.dia .grid-l{stroke:var(--ink);stroke-width:2;opacity:.55}
.dia .nut{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.dia .dot{fill:var(--accent)}
.dia .barre{fill:var(--accent);opacity:.45}
.dia .fn{fill:var(--accent-ink);font:700 15px var(--body);text-anchor:middle;dominant-baseline:central}
.dia .open{fill:none;stroke:var(--ink);stroke-width:2}
.dia .lbl{fill:var(--muted);font:700 13px var(--body);text-anchor:middle}
.dia .fr{fill:var(--muted);font:500 11px var(--body);text-anchor:end;dominant-baseline:central}
.legend{font-size:13px;color:var(--muted);margin:0}

.progs{display:flex;flex-direction:column;gap:6px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:9px 12px;text-align:left}
.prog b{font-size:16px;white-space:nowrap}
.prog span{font-size:13px;color:var(--muted);text-align:right}
.prog[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.donate{display:inline-block;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:8px 16px;font-weight:700;text-decoration:none}
.donate:hover{background:var(--accent);color:var(--accent-ink)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.level h3{margin:0 0 2px;font-size:16px}
.level p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.level .quick .chip{font-size:15px;padding:6px 12px;min-width:50px}
</style>
</head>

  <header>

      </section>

    <div class="col">
      <section class="card">
        <h2 data-t="hLearn"></h2>

          <div>

            <p class="cfull" id="cfull"></p>

          </div>

      </section>

      <section class="card">
        <h2 data-t="hProgs"></h2>
        <div class="progs" id="progs"></div>
      </section>
    </div>
  </div>

  <section class="card">
    <h2 data-t="hLevels"></h2>
    <div class="levels" id="levels"></div>
  </section>

  <footer class="foot"><span data-t="donateLead"></span><a class="donate" href="https://urbantechmonk.gumroad.com/coffee" target="_blank" rel="noopener" data-t="donate"></a></footer>
</div>

      master=ctx.createGain();master.gain.value=0.9;
      var lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=5200;
      var body=ctx.createBiquadFilter();body.type="peaking";body.frequency.value=380;body.Q.value=1;body.gain.value=4;
      var comp=ctx.createDynamicsCompressor();
      master.connect(body);body.connect(lp);lp.connect(comp);comp.connect(ctx.destination);
    }catch(e){ctx=null;return false;}
  }
  if(ctx.state==="suspended"){ctx.resume().catch(function(){});}
  return true;
}
function getBuf(midi){
  if(bufs[midi])return bufs[midi];
  var sr=ctx.sampleRate,f=440*Math.pow(2,(midi-69)/12),N=Math.round(sr/f),len=Math.floor(sr*2.4);
  var ring=new Float32Array(N),i;
  for(i=0;i<N;i++)ring[i]=Math.random()*2-1;
  // zachte nylonklank: ruis twee keer gladstrijken
  for(var p=0;p<3;p++){var prev=ring[N-1];for(i=0;i<N;i++){var cur=ring[i];ring[i]=(prev+cur)/2;prev=cur;}}
  var b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0),idx=0,peak=0;
  for(i=0;i<len;i++){
    var v=ring[idx];d[i]=v;if(Math.abs(v)>peak)peak=Math.abs(v);
    var nx=(idx+1)%N;ring[idx]=0.9965*0.5*(ring[idx]+ring[nx]);idx=nx;
  }
  var fade=Math.floor(sr*0.15);
  for(i=0;i<len;i++){d[i]=d[i]/(peak||1);if(i>len-fade)d[i]*=(len-i)/fade;}
  bufs[midi]={b:b,rate:f*N/sr};
  return bufs[midi];
}
function pluck(s,t,vel,frets){
  if(!audio())return;
  var now=ctx.currentTime;if(t==null||t<now)t=now;
  var o=getBuf(OPEN[s]+frets[s]);
  var src=ctx.createBufferSource();src.buffer=o.b;src.playbackRate.value=o.rate;
  var g=ctx.createGain();g.gain.value=0.5*vel;
  src.connect(g);g.connect(master);
  var old=voices[s];
  if(old){try{old.g.gain.setTargetAtTime(0,t,0.008);old.src.stop(t+0.08);}catch(e){}}
  src.start(t);voices[s]={src:src,g:g};
  var delay=Math.max(0,(t-now)*1000);
  setTimeout(function(){ringString(s);},delay);
}
function strum(dir,when,frets){
  if(!audio())return;
  frets=frets||CH[S.chord].f;
  var t0=(when==null)?ctx.currentTime:when;
  var order=dir>0?[0,1,2,3]:[3,2,1,0];
  for(var i=0;i<4;i++)pluck(order[i],t0+i*0.024,dir>0?1:0.72,frets);
  var btn=dir>0?$("btnDown"):$("btnUp");
  setTimeout(function(){btn.classList.add("hit");setTimeout(function(){btn.classList.remove("hit");},110);},Math.max(0,(t0-ctx.currentTime)*1000));
}

/* ---------- snaren ---------- */
var strEls=[],POS=[20,40,60,80];
function buildPad(){
  var pad=$("pad");
  for(var s=0;s<4;s++){
    var d=el("div","string");d.style.top=POS[s]+"%";
    var b=el("b",null,SNAMES[s]);var i=el("i");i.style.height=[3,5,4,3][s]+"px";var em=el("em");
    d.appendChild(b);d.appendChild(i);d.appendChild(em);pad.appendChild(d);strEls.push(d);
  }
  var lastY=null;
  function ys(){var r=pad.getBoundingClientRect();return POS.map(function(p){return r.top+r.height*p/100;});}
  pad.addEventListener("pointerdown",function(e){
    e.preventDefault();try{pad.setPointerCapture(e.pointerId);}catch(x){}
    lastY=e.clientY;var y=ys();
    for(var s=0;s<4;s++){if(Math.abs(y[s]-e.clientY)<13){pluck(s,null,1,CH[S.chord].f);break;}}
  });
  pad.addEventListener("pointermove",function(e){
    if(lastY==null)return;
    var y=ys(),a=lastY,b=e.clientY;if(a===b)return;
    var hit=[];
    for(var s=0;s<4;s++){if((y[s]>a&&y[s]<=b)||(y[s]<a&&y[s]>=b))hit.push(s);}
    if(b<a)hit.reverse();
    for(var i=0;i<hit.length;i++)pluck(hit[i],ctx?ctx.currentTime+i*0.012:null,b>a?1:0.75,CH[S.chord].f);
    lastY=b;
  });
  function end(){lastY=null;}
  pad.addEventListener("pointerup",end);pad.addEventListener("pointercancel",end);
}
function ringString(s){
  var d=strEls[s];d.classList.remove("ring");void d.offsetWidth;d.classList.add("ring");
}

/* ---------- akkoorddiagram ---------- */
function diagram(name){
  var c=CH[name],X=[44,84,124,164],top=42,fh=44,rows=4,ns="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 190 262");svg.setAttribute("class","dia");
  svg.setAttribute("role","img");svg.setAttribute("aria-label",t("dia")+" "+name);
  function add(tag,attrs,txt){var e=document.createElementNS(ns,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e;}
  var i;
  for(i=0;i<4;i++)add("line",{x1:X[i],y1:top,x2:X[i],y2:top+fh*rows,"class":"grid-l"});
  for(i=1;i<=rows;i++){add("line",{x1:X[0],y1:top+fh*i,x2:X[3],y2:top+fh*i,"class":"grid-l"});add("text",{x:26,y:top+fh*(i-0.5),"class":"fr"},String(i));}
  add("line",{x1:X[0],y1:top,x2:X[3],y2:top,"class":"nut"});
  if(c.barre){var y=top+fh*(c.barre.fret-0.5);add("rect",{x:X[c.barre.from]-15,y:y-15,width:X[c.barre.to]-X[c.barre.from]+30,height:30,rx:15,"class":"barre"});}
  for(i=0;i<4;i++){
    if(c.f[i]===0){add("circle",{cx:X[i],cy:20,r:8,"class":"open"});}
    else{var cy=top+fh*(c.f[i]-0.5);add("circle",{cx:X[i],cy:cy,r:15,"class":"dot"});add("text",{x:X[i],y:cy+1,"class":"fn"},String(c.g[i]));}
    add("text",{x:X[i],y:top+fh*rows+26,"class":"lbl"},SNAMES[i]);
  }
  return svg;
}

/* ---------- weergave ---------- */
function chip(name,idx){
  var b=el("button","chip",name);b.type="button";b.dataset.chord=name;
  if(idx!=null){b.dataset.pos=idx;var sm=el("small",null,String(idx+1));b.appendChild(sm);}
  return b;
}
function renderChord(){
  var c=CH[S.chord];
  $("cname").textContent=S.chord;$("cfull").textContent=L(c.full);$("tip").textContent=L(c.tip);
  var d=$("dia");d.textContent="";d.appendChild(diagram(S.chord));
  var n=$("notes");n.textContent="";
  for(var s=0;s<4;s++){
    var nm=NN[(OPEN[s]+c.f[s])%12];
    var sp=el("span","note");sp.appendChild(el("b",null,SNAMES[s]+t("strSuffix")));sp.appendChild(document.createTextNode(nm));n.appendChild(sp);
    strEls[s].lastChild.textContent=c.f[s]===0?t("open"):t("fret")+c.f[s];
  }
  var q=$("quick").children,i;
  for(i=0;i<q.length;i++)q[i].setAttribute("aria-pressed",String(+q[i].dataset.pos===S.pos&&q[i].dataset.chord===S.chord));
  var all=document.querySelectorAll("#levels .chip");
  for(i=0;i<all.length;i++)all[i].setAttribute("aria-pressed",String(all[i].dataset.chord===S.chord));
}
function renderQuick(){
  var q=$("quick");q.textContent="";
  PROGS[S.prog].c.forEach(function(n,i){q.appendChild(chip(n,i));});
  var p=$("progs").children;for(var i=0;i<p.length;i++)p[i].setAttribute("aria-pressed",String(i===S.prog));
}
function renderSteps(active){
  var st=$("steps"),pat=PATS[S.pat].s,an=t("and"),lab=["1",an,"2",an,"3",an,"4",an];
  st.textContent="";
  for(var i=0;i<8;i++){
    var ch=pat.charAt(i),d=el("div","step"+(ch==="-"?" rest":"")+(i===active?" on":""));
    d.appendChild(el("span","a",ch==="D"?"↓":ch==="U"?"↑":"·"));d.appendChild(el("span","n",lab[i]));st.appendChild(d);
  }
  var p=$("pats").children;for(var j=0;j<p.length;j++)p[j].setAttribute("aria-pressed",String(j===S.pat));
}
function markStep(i){var c=$("steps").children;for(var k=0;k<c.length;k++)c[k].classList.toggle("on",k===i);}
function setChord(name,pos){
  S.chord=name;
  if(pos!=null)S.pos=pos;
  else{var k=PROGS[S.prog].c.indexOf(name);if(k>=0)S.pos=k;else{S.pos=-1;S.auto=false;$("autoSwitch").checked=false;}}
  renderChord();save();
}
function setProg(i){S.prog=i;S.pos=0;S.chord=PROGS[i].c[0];firstBar=true;renderQuick();renderChord();save();}

/* ---------- automatisch ritme ---------- */
var playing=false,timer=null,nextT=0,step=0,firstBar=true;
function tick(){
  while(nextT<ctx.currentTime+0.12){
    if(step===0){
      if(S.auto&&!firstBar){var pc=PROGS[S.prog].c;S.pos=(S.pos+1)%pc.length;S.chord=pc[S.pos];}
      firstBar=false;
    }
    var ch=PATS[S.pat].s.charAt(step),frets=CH[S.chord].f;
    if(ch==="D")strum(1,nextT,frets);else if(ch==="U")strum(-1,nextT,frets);
    (function(st,name,pos){setTimeout(function(){
      if(!playing)return;markStep(st);
      if(st===0&&$("cname").textContent!==name){renderChord();}
      else if(st===0){renderChord();}
    },Math.max(0,(nextT-ctx.currentTime)*1000));})(step,S.chord,S.pos);
    nextT+=60/S.bpm/2;step=(step+1)%8;
  }
}
function start(){
  if(!audio())return;
  playing=true;step=0;firstBar=true;nextT=ctx.currentTime+0.08;
  if(S.pos<0&&S.auto){S.pos=0;S.chord=PROGS[S.prog].c[0];}
  $("play").textContent="■ "+t("stop");timer=setInterval(tick,25);tick();
}
function stop(){playing=false;clearInterval(timer);$("play").textContent="▶ "+t("start");markStep(-1);renderChord();}

/* ---------- onthouden ---------- */
function save(){try{localStorage.setItem("uke-oefenkamer",JSON.stringify(S));}catch(e){}}
function load(data){
  S.lang=((navigator.language||"nl").toLowerCase().indexOf("nl")===0)?"nl":"en";
  var d=data&&data.chord?data:null;
  if(!d){try{d=JSON.parse(localStorage.getItem("uke-oefenkamer")||"null");}catch(e){d=null;}}
  if(d&&CH[d.chord]&&PROGS[d.prog]&&PATS[d.pat]){
    S.chord=d.chord;S.prog=d.prog;S.pos=(typeof d.pos==="number")?d.pos:0;S.pat=d.pat;
    S.bpm=Math.min(140,Math.max(50,+d.bpm||80));S.auto=d.auto!==false;if(d.lang&&T[d.lang])S.lang=d.lang;
  }
}

function buildLists(){
  var lv=$("levels"),pg=$("progs"),pt=$("pats");lv.textContent="";pg.textContent="";pt.textContent="";
  LEVELS.forEach(function(Lv){
    var d=el("div","level");d.appendChild(el("h3",null,L(Lv.t)));d.appendChild(el("p",null,L(Lv.d)));
    var q=el("div","quick");Lv.c.forEach(function(n){q.appendChild(chip(n));});d.appendChild(q);lv.appendChild(d);
  });
  PROGS.forEach(function(P,i){
    var b=el("button","prog");b.type="button";b.dataset.i=i;
    b.appendChild(el("b",null,P.c.join(" – ")));b.appendChild(el("span",null,L(P.d)));pg.appendChild(b);
  });
  PATS.forEach(function(P,i){var b=el("button","pat",L(P.n));b.type="button";b.dataset.i=i;pt.appendChild(b);});
}
function applyLang(){
  document.documentElement.lang=S.lang;document.title=t("title");
  $("t1").textContent=t("t1");$("t2").textContent=t("t2");
  var n=document.querySelectorAll("[data-t]"),i;
  for(i=0;i<n.length;i++)n[i].innerHTML=t(n[i].getAttribute("data-t"));
  $("pad").setAttribute("aria-label",t("padAria"));
  $("play").textContent=playing?"■ "+t("stop"):"▶ "+t("start");
  var lb=document.querySelectorAll(".lang button");
  for(i=0;i<lb.length;i++)lb[i].setAttribute("aria-pressed",String(lb[i].dataset.lang===S.lang));
  buildLists();renderQuick();renderSteps(-1);renderChord();
}
function boot(data){
  load(data);
  buildPad();
  $("bpm").value=S.bpm;$("bpmOut").textContent=S.bpm+" bpm";$("autoSwitch").checked=S.auto;
  applyLang();
  document.querySelector(".lang").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;S.lang=b.dataset.lang;applyLang();save();});

  $("quick").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;setChord(b.dataset.chord,+b.dataset.pos);strum(1);});
  $("levels").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;setChord(b.dataset.chord);strum(1);});
  $("progs").addEventListener("click",function(e){var b=e.target.closest(".prog");if(!b)return;setProg(+b.dataset.i);S.auto=true;$("autoSwitch").checked=true;save();if(!playing)strum(1);});
  $("pats").addEventListener("click",function(e){var b=e.target.closest(".pat");if(!b)return;S.pat=+b.dataset.i;renderSteps(-1);save();});
  $("btnDown").addEventListener("pointerdown",function(e){e.preventDefault();strum(1);});
  $("btnUp").addEventListener("pointerdown",function(e){e.preventDefault();strum(-1);});
  $("btnDown").addEventListener("click",function(e){if(e.detail===0)strum(1);});
  $("btnUp").addEventListener("click",function(e){if(e.detail===0)strum(-1);});
  $("play").addEventListener("click",function(){playing?stop():start();});
  $("bpm").addEventListener("input",function(){S.bpm=+this.value;$("bpmOut").textContent=S.bpm+" bpm";save();});
  $("autoSwitch").addEventListener("change",function(){S.auto=this.checked;save();});
  document.addEventListener("keydown",function(e){
    if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
    var tag=(e.target.tagName||"").toLowerCase();
    if(e.key==="ArrowDown"){if(tag==="input")return;e.preventDefault();strum(1);}
    else if(e.key==="ArrowUp"){if(tag==="input")return;e.preventDefault();strum(-1);}
    else if(e.key===" "){if(tag==="button"||tag==="input")return;e.preventDefault();playing?stop():start();}
    else if(e.key>="1"&&e.key<="4"){var pc=PROGS[S.prog].c,k=+e.key-1;if(pc[k])setChord(pc[k],k);}
  });
  try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return S;});}catch(e){}
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
